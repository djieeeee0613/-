<div class="card" style="max-width: 420px; margin: 2rem auto;">
  <h2 style="margin-bottom: 1.25rem;">註冊作者帳號</h2>
  <form method="POST" action="/register">
    <div class="form-group">
      <label class="form-label" for="username">帳號</label>
      <input type="text" name="username" id="username" class="form-control" required maxlength="50" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="name">顯示名稱</label>
      <input type="text" name="name" id="name" class="form-control" required maxlength="100">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">密碼</label>
      <input type="password" name="password" id="password" class="form-control" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm">確認密碼</label>
      <input type="password" name="confirm" id="confirm" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">註冊</button>
  </form>
  <p style="margin-top: 1rem; font-size: 0.9rem; color: var(--secondary);">
    已有帳號？<a href="/login">前往登入</a>
  </p>
</div>
