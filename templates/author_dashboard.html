<div class="page-header">
  <div>
    <h1 class="page-title">✍️ 作者專區 — 我的投稿稿件清單</h1>
    <p class="page-subtitle">查看投稿稿件清單 (類別、標題、審查狀態)、新增/編輯投稿、刪除編輯中稿件與送出審查</p>
  </div>
  <div style="display: flex; gap: 0.6rem;">
    <a href="/author" class="btn btn-outline">🔄 刷新清單狀態</a>
    <a href="/author/new" class="btn btn-primary">➕ 新增投稿</a>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <span class="stat-label">總投稿數</span>
    <span class="stat-value">{{count_total}}</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">草稿 (編輯中)</span>
    <span class="stat-value" style="color: #64748b;">{{count_draft}}</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">待審查 (審查中)</span>
    <span class="stat-value" style="color: var(--warning);">{{count_review}}</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">已發布 (已通過)</span>
    <span class="stat-value" style="color: var(--success);">{{count_approved}}</span>
  </div>
</div>

<div class="card" style="padding: 0;">
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width: 80px;">編號</th>
          <th style="width: 130px;">類別</th>
          <th>標題</th>
          <th style="width: 130px; text-align: center;">審查狀態</th>
          <th style="width: 165px;">最後更新時間</th>
          <th style="width: 260px; text-align: right;">操作</th>
        </tr>
      </thead>
      <tbody>
        {{table_rows}}
      </tbody>
    </table>
  </div>
</div>
