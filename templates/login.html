<div class="portal-wrapper">
  <h1 class="portal-title">投稿審查系統</h1>
  <p class="portal-subtitle">請選擇身份並登入（可開多個分頁，作者與管理員同時操作互不干擾）</p>

  <div class="card" style="max-width: 420px; margin: 2rem auto; text-align: left;">
    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="role">身份</label>
        <select name="role" id="role" class="form-control">
          <option value="author">✍️ 作者</option>
          <option value="editor">🔍 管理員 / 編輯</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="username">帳號</label>
        <input type="text" name="username" id="username" class="form-control" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密碼</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;">登入</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.9rem; color: var(--secondary); text-align: center;">
      還沒有帳號？<a href="/register">註冊作者帳號</a>
    </p>
  </div>
</div>
